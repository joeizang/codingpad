# Runs the same `just check` used locally (D39) on Linux and Windows.
name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Windows minutes are only free on a public repository, so a private repo runs Linux alone.
        include: ${{ fromJSON(github.event.repository.private && '[{"name":"Linux","os":"ubuntu-latest"}]' || '[{"name":"Linux","os":"ubuntu-latest"},{"name":"Windows","os":"windows-latest"}]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"

      - name: Install TypeScript 7 language server
        shell: bash
        run: |
          # Pinned preview; bump deliberately with the TypeScript tests.
          bun add -g @typescript/native-preview@7.0.0-dev.20260707.2
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            BIN=$(cygpath -u "$(bun pm bin -g)")
            echo "CODINGPAD_TS_LSP=$(cygpath -w "$BIN/tsgo.cmd")" >> "$GITHUB_ENV"
          else
            echo "CODINGPAD_TS_LSP=$(bun pm bin -g)/tsgo" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6" # the uv release the app installs privately

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.59.0"

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy,rust-analyzer,rust-src && rustup default stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Only master writes the cache, so PRs cannot poison it and storage stays small.
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: just check
        run: just check

      - name: Private Rust installation
        run: cargo test -p codingpad-kernel-core --lib private_install_recovers_and_compiles_after_promotion --locked -- --ignored

      - name: TypeScript package code intelligence
        run: cargo test -p codingpad-kernel-core --test language_server typescript_code_intelligence_resolves_versioned_packages --locked -- --ignored

      - name: TypeScript server database integration
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          export POSTGRES_PASSWORD="Cpad_Aa1_$(openssl rand -hex 16)"
          export MSSQL_SA_PASSWORD="Cpad_Aa1_$(openssl rand -hex 16)"
          trap 'docker rm -f codingpad-test-postgres codingpad-test-sqlserver >/dev/null 2>&1 || true' EXIT
          docker run -d --name codingpad-test-postgres -p 127.0.0.1::5432 \
            -e POSTGRES_PASSWORD postgres:17-alpine
          docker run -d --name codingpad-test-sqlserver -p 127.0.0.1::1433 \
            -e ACCEPT_EULA=Y -e MSSQL_PID=Developer -e MSSQL_SA_PASSWORD \
            mcr.microsoft.com/mssql/server:2022-latest
          timeout 120 bash -c 'until docker exec codingpad-test-postgres pg_isready -h 127.0.0.1; do sleep 2; done'
          timeout 120 bash -c 'until docker exec -e SQLCMDPASSWORD="$MSSQL_SA_PASSWORD" codingpad-test-sqlserver /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -Q "SELECT 1" -b -l 2; do sleep 2; done'
          export CODINGPAD_TEST_POSTGRES_HOST=127.0.0.1 CODINGPAD_TEST_POSTGRES_USER=postgres
          export CODINGPAD_TEST_POSTGRES_DATABASE=postgres CODINGPAD_TEST_POSTGRES_PASSWORD="$POSTGRES_PASSWORD"
          export CODINGPAD_TEST_POSTGRES_PORT="$(docker port codingpad-test-postgres 5432 | cut -d: -f2)"
          export CODINGPAD_TEST_SQLSERVER_HOST=127.0.0.1 CODINGPAD_TEST_SQLSERVER_USER=sa
          export CODINGPAD_TEST_SQLSERVER_DATABASE=master CODINGPAD_TEST_SQLSERVER_PASSWORD="$MSSQL_SA_PASSWORD"
          export CODINGPAD_TEST_SQLSERVER_PORT="$(docker port codingpad-test-sqlserver 1433 | cut -d: -f2)"
          export CODINGPAD_TEST_SQLSERVER_TRUST=1
          cargo test -p codingpad-kernel-core --test typescript typescript_queries_postgres_and_sql_server_with_vault_passwords --locked -- --ignored
