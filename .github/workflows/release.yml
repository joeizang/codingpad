# Builds the installers for a `v*` tag and publishes them as a GitHub Release.
# Pull requests that touch release packaging build the installers for verification.
# A plain `vX.Y.Z` tag is a normal release, which the in-app update notice offers; a tag with a
# suffix such as `v0.2.0-rc.1` is a pre-release, which it ignores.
name: Release

on:
  pull_request:
    branches: [master]
    paths:
      - .github/workflows/release.yml
      - apps/desktop/src-tauri/tauri.macos.conf.json
      - apps/desktop/src-tauri/icons/icon.icns
      - tools/github/render-homebrew-cask.sh
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: ${{ github.event_name == 'push' }}
      matrix:
        include:
          # The oldest supported runner keeps the AppImage's glibc requirement low.
          - name: Linux
            os: ubuntu-22.04
            bundles: |
              target/release/bundle/appimage/*.AppImage
              target/release/bundle/deb/*.deb
              target/release/bundle/rpm/*.rpm
          - name: Windows
            os: windows-latest
            bundles: target/release/bundle/nsis/*-setup.exe
          - name: macOS (Apple silicon)
            os: macos-15
            bundles: target/release/bundle/dmg/*.dmg
          - name: macOS (Intel)
            os: macos-15-intel
            bundles: target/release/bundle/dmg/*.dmg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the tag matches the app version
        if: github.event_name == 'push'
        shell: bash
        run: |
          version=$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)
          if [ "${GITHUB_REF_NAME%%-*}" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match tauri.conf.json version $version"
            exit 1
          fi

      - name: Check the rendered Homebrew cask
        if: github.event_name == 'pull_request' && runner.os == 'macOS' && runner.arch == 'ARM64'
        shell: bash
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          fixture=$(mktemp -d)
          trap 'rm -r "$fixture"' EXIT
          mkdir "$fixture/Casks"
          printf 'Apple silicon fixture\n' > "$fixture/CodingPad_0.1.0_aarch64.dmg"
          printf 'Intel fixture\n' > "$fixture/CodingPad_0.1.0_x64.dmg"
          tools/github/render-homebrew-cask.sh v0.1.0 "$fixture" > "$fixture/Casks/codingpad.rb"

          git -C "$fixture" init --quiet
          git -C "$fixture" add Casks/codingpad.rb
          git -C "$fixture" -c user.name=CI -c user.email=ci@example.invalid commit --quiet -m 'Create cask fixture'
          tap=local/codingpad-fixture
          brew tap "$tap" "file://$fixture"
          brew trust --cask "$tap/codingpad"
          brew style --cask "$tap/codingpad"
          # Online audits need a published release and real disk images.
          brew audit --cask --strict --arch=all "$tap/codingpad"

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          # Release builds use no caches, so nothing a PR wrote can reach a published installer.
          package-manager-cache: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.59.0"

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: just bundle
        run: just bundle

      - name: Verify the macOS bundle
        if: runner.os == 'macOS'
        shell: bash
        run: |
          version=$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)
          case "$RUNNER_ARCH" in
            ARM64) arch=aarch64 ;;
            X64) arch=x64 ;;
            *) echo "Unsupported macOS runner architecture $RUNNER_ARCH" >&2; exit 1 ;;
          esac
          codesign --verify --deep --strict target/release/bundle/macos/CodingPad.app
          hdiutil verify "target/release/bundle/dmg/CodingPad_${version}_${arch}.dmg"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installers-${{ matrix.name }}
          path: ${{ matrix.bundles }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    name: Publish release
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: installers-*
          path: installers
          merge-multiple: true

      - name: Generate the Homebrew cask for stable releases
        if: ${{ !contains(github.ref_name, '-') }}
        run: tools/github/render-homebrew-cask.sh "$GITHUB_REF_NAME" installers > installers/codingpad.rb

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          prerelease=()
          case "$GITHUB_REF_NAME" in *-*) prerelease=(--prerelease) ;; esac
          # The Linux artifact keeps its appimage/, deb/ and rpm/ folders, and a release asset must be a file.
          mapfile -t assets < <(find installers -type f | sort)
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
            --verify-tag --generate-notes --title "CodingPad ${GITHUB_REF_NAME#v}" "${prerelease[@]}"
