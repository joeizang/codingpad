[package]
name = "codingpad-kernel-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"
toml = "0.8"
toml_edit = { version = "0.25", default-features = false, features = ["parse"] }
sha2 = "0.10"
getrandom = "0.4"
dirs = "7"
tempfile = "3"
tokio = { version = "1", features = ["process", "io-util", "net", "sync", "rt-multi-thread", "macros", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
flate2 = "1"
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
url = "2"
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
rusqlite = { version = "0.41", features = ["bundled"] }
postgres-protocol = "0.6"
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-uuid-1", "with-serde_json-1"] }
postgres-native-tls = "0.5"
native-tls = "0.2"
futures-util = "0.3"
rust_decimal = { version = "1", default-features = false, features = ["std", "db-tokio-postgres"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
uuid = "1"
tiberius = { version = "0.13", default-features = false, features = ["tds80", "rustls", "chrono"] }
tokio-util = { version = "0.7", features = ["compat"] }
rust_xlsxwriter = { version = "0.102.0", features = ["constant_memory"] }
oxc_allocator = "0.110"
oxc_ast = "0.110"
oxc_ast_visit = "0.110"
oxc_parser = { version = "0.110", default-features = false }
oxc_span = "0.110"
proc-macro2 = { version = "1", features = ["span-locations"] }
syn = { version = "2", features = ["full"] }
unicode-width = "0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
